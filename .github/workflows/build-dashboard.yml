name: Build Oqab Ground Station

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Dashboard Node Modules
        working-directory: ./dashboard
        run: npm ci

      - name: Build Dashboard Frontend
        working-directory: ./dashboard
        run: npm run build

      - name: Build Tauri Desktop Binary
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './dashboard'
          tagName: v__VERSION__
          releaseName: 'Oqab Ground Station v__VERSION__'
          releaseBody: 'Automated release build of the Oqab Ground Station desktop application.'
          releaseDraft: true
          prerelease: false

      - name: Upload Windows Executable Artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: OqabGroundStation-Windows-x64
          path: |
            dashboard/src-tauri/target/release/OqabGroundStation.exe
            dashboard/src-tauri/target/release/bundle/nsis/*.exe
            dashboard/src-tauri/target/release/bundle/msi/*.msi

      - name: Upload Linux Binary Artifact
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: OqabGroundStation-Linux-x64
          path: |
            dashboard/src-tauri/target/release/bundle/appimage/*.AppImage
            dashboard/src-tauri/target/release/bundle/deb/*.deb

